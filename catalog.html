<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог серіалів</title>
    <meta
            name="description"
            content="Результати пошуку серіалів з фільтрами за жанром і статусом та сортуванням за рейтингом, назвою чи датою."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<a class="skip-link" href="#main">Перейти до основного вмісту</a>

<header class="site-header">
    <a class="logo" href="/">Серіали</a>
    <nav aria-label="Основна навігація">
        <ul>
            <li><a href="/">Головна</a></li>
            <li><a href="/catalog.html" aria-current="page">Каталог</a></li>
        </ul>
    </nav>
    <button type="button" id="theme-toggle" aria-pressed="false">
        Темна тема
    </button>
</header>

<main id="main">
    <h1>Каталог серіалів</h1>

    <form id="search-form" role="search" action="/catalog.html" method="get">
        <label for="search-input">Назва серіалу</label>
        <input
                type="search"
                id="search-input"
                name="q"
                required
                autocomplete="off"
        />
        <button type="submit">Шукати</button>
    </form>

    <section aria-labelledby="filters-title">
        <h2 id="filters-title">Фільтри та сортування</h2>
        <div class="filters">
            <div>
                <label for="genre-filter">Жанр</label>
                <select id="genre-filter" name="genre">
                    <option value="">Усі жанри</option>
                </select>
            </div>
            <div>
                <label for="status-filter">Статус</label>
                <select id="status-filter" name="status">
                    <option value="">Будь-який</option>
                    <option value="Running">Виходить</option>
                    <option value="Ended">Завершено</option>
                </select>
            </div>
            <div>
                <label for="sort-select">Сортувати</label>
                <select id="sort-select" name="sort">
                    <option value="relevance">За релевантністю</option>
                    <option value="rating">За рейтингом</option>
                    <option value="name">За назвою</option>
                    <option value="premiered">За датою прем'єри</option>
                </select>
            </div>
        </div>
    </section>

    <section aria-labelledby="results-title">
        <h2 id="results-title">Результати</h2>
        <div id="status" role="status" aria-live="polite"></div>
        <ul id="results-list" class="show-grid"></ul>
    </section>
</main>

<footer class="site-footer">
    <p>Дані надає <a href="https://www.tvmaze.com/api">TVmaze API</a>.</p>
</footer>

<script type="module" src="/src/pages/catalog.ts"></script>
</body>
</html>
