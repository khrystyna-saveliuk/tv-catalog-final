<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Серіали: пошук і фільтри</title>
    <meta
            name="description"
            content="Шукайте серіали за назвою, фільтруйте за жанрами та десятиліттям виходу, сортуйте за рейтингом чи датою прем'єри."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/base.css" />
</head>
<body>
<a class="skip-link" href="#main">Перейти до основного вмісту</a>

<header class="site-header">
    <a class="logo" href="/">Серіали</a>
    <nav aria-label="Основна навігація">
        <ul>
            <li><a href="/" aria-current="page">Головна</a></li>
            <li><a href="/library.html">Моя бібліотека</a></li>
        </ul>
    </nav>
    <button type="button" id="theme-toggle" aria-pressed="false">
        Темна тема
    </button>
</header>

<main id="main">
    <h1>Знайдіть свій наступний серіал</h1>

    <form id="search-form" class="search-form" role="search" action="/" method="get">
        <label for="search-input" class="visually-hidden">Назва серіалу</label>
        <input
                type="search"
                id="search-input"
                name="q"
                placeholder="Назва серіалу, наприклад Breaking Bad"
                autocomplete="off"
        />
        <button type="submit" class="button-primary">Шукати</button>
    </form>

    <section class="filters" aria-labelledby="filters-title">
        <h2 id="filters-title" class="visually-hidden">Фільтри та сортування</h2>

        <div class="filters__bar">
            <details class="filter-group">
                <summary>
                    Жанри <span id="genre-count" class="filter-count"></span>
                </summary>
                <fieldset>
                    <legend class="visually-hidden">Жанри</legend>
                    <div id="genre-options" class="checkbox-list"></div>
                </fieldset>
            </details>

            <details class="filter-group">
                <summary>
                    Десятиліття <span id="decade-count" class="filter-count"></span>
                </summary>
                <fieldset>
                    <legend class="visually-hidden">Десятиліття виходу</legend>
                    <div id="decade-options" class="checkbox-list"></div>
                </fieldset>
            </details>

            <div class="filters__sort">
                <label for="sort-select">Сортування</label>
                <select id="sort-select" name="sort">
                    <option value="rating">Спочатку найвище оцінені</option>
                    <option value="newest">Спочатку найновіші</option>
                    <option value="oldest">Спочатку найстаріші</option>
                </select>
            </div>

            <button type="button" id="reset-filters">Скинути фільтри</button>
        </div>
    </section>

    <section aria-labelledby="results-title">
        <h2 id="results-title" class="visually-hidden">Серіали</h2>
        <div id="status" role="status" aria-live="polite"></div>
        <ul id="results-list" class="show-grid"></ul>
        <button type="button" id="show-more" hidden>Показати ще</button>
    </section>
</main>

<footer class="site-footer">
    <p>Дані надає <a href="https://www.tvmaze.com/api">TVmaze API</a>.</p>
</footer>

<script type="module" src="/src/pages/home.ts"></script>
</body>
</html>
