<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Серіали: пошук і каталог</title>
    <meta
            name="description"
            content="Шукайте серіали за назвою, переглядайте рейтинги, жанри, акторський склад та епізоди."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<a class="skip-link" href="#main">Перейти до основного вмісту</a>

<header class="site-header">
    <a class="logo" href="/">Серіали</a>
    <nav aria-label="Основна навігація">
        <ul>
            <li><a href="/" aria-current="page">Головна</a></li>
            <li><a href="/catalog.html">Каталог</a></li>
        </ul>
    </nav>
    <button type="button" id="theme-toggle" aria-pressed="false">
        Темна тема
    </button>
</header>

<main id="main">
    <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Знайдіть свій наступний серіал</h1>
        <p>Пошук за назвою, рейтинги, жанри, акторський склад та епізоди.</p>

        <form role="search" action="/catalog.html" method="get">
            <label for="search-input">Назва серіалу</label>
            <input
                    type="search"
                    id="search-input"
                    name="q"
                    required
                    autocomplete="off"
            />
            <button type="submit">Шукати</button>
        </form>
    </section>

    <section aria-labelledby="featured-title">
        <h2 id="featured-title">Добірка серіалів</h2>
        <div id="status" role="status" aria-live="polite"></div>
        <ul id="featured-list" class="show-grid"></ul>
    </section>
</main>

<footer class="site-footer">
    <p>Дані надає <a href="https://www.tvmaze.com/api">TVmaze API</a>.</p>
</footer>

<script type="module" src="/src/pages/home.ts"></script>
</body>
</html>
