<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Інформація про серіал</title>
        <meta
            name="description"
            content="Опис серіалу, рейтинг, жанри, акторський склад і список епізодів за сезонами."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <script>
            try {
                var stored = localStorage.getItem('tv-catalog:theme');
                var theme =
                    stored === 'light' || stored === 'dark'
                        ? stored
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light';
                document.documentElement.dataset.theme = theme;
            } catch (e) {}
        </script>
        <link rel="stylesheet" href="/src/styles/base.css" />
    </head>
    <body>
        <a class="skip-link" href="#main">Перейти до основного вмісту</a>

        <header class="site-header">
            <a class="logo" href="/">Серіали</a>
            <nav aria-label="Основна навігація">
                <ul>
                    <li><a href="/">Головна</a></li>
                    <li><a href="/library.html">Моя бібліотека</a></li>
                </ul>
            </nav>
            <button type="button" id="theme-toggle">Темна тема</button>
        </header>

        <main id="main">
            <div id="status" role="status" aria-live="polite"></div>

            <article
                id="show-details"
                class="show-details"
                aria-labelledby="show-title"
                hidden
            >
                <div class="show-hero">
                    <img
                        id="show-poster"
                        class="show-hero__poster"
                        alt=""
                        width="210"
                        height="295"
                    />

                    <div class="show-hero__info">
                        <h1 id="show-title"></h1>
                        <dl id="show-meta" class="show-meta"></dl>

                        <div
                            class="library-actions"
                            role="group"
                            aria-label="Моя бібліотека"
                        >
                            <button
                                type="button"
                                id="want-toggle"
                                class="pill"
                            ></button>
                            <button
                                type="button"
                                id="watched-toggle"
                                class="pill"
                            ></button>
                            <button
                                type="button"
                                id="favorite-toggle"
                                class="icon-button"
                                aria-describedby="favorite-hint"
                                disabled
                            ></button>
                        </div>
                        <p id="favorite-hint" class="library-hint">
                            Щоб додати до улюбленого, спочатку позначте серіал
                            переглянутим.
                        </p>
                        <p id="library-message" role="status"></p>

                        <div id="show-summary" class="show-summary"></div>
                    </div>
                </div>

                <section aria-labelledby="cast-title">
                    <h2 id="cast-title">Акторський склад</h2>
                    <div
                        id="cast-status"
                        role="status"
                        aria-live="polite"
                    ></div>
                    <ul id="cast-list" class="cast-grid"></ul>
                    <button type="button" id="cast-more" hidden>
                        Показати всіх
                    </button>
                </section>

                <section aria-labelledby="episodes-title">
                    <h2 id="episodes-title">Епізоди</h2>
                    <div
                        id="episodes-status"
                        role="status"
                        aria-live="polite"
                    ></div>
                    <div id="season-controls" class="season-controls" hidden>
                        <label for="season-select">Сезон</label>
                        <select id="season-select"></select>
                    </div>
                    <ol id="episodes-list" class="episode-list"></ol>
                </section>
            </article>
        </main>

        <footer class="site-footer">
            <p>
                Дані надає <a href="https://www.tvmaze.com/api">TVmaze API</a>.
            </p>
        </footer>

        <script type="module" src="/src/pages/show.ts"></script>
    </body>
</html>
